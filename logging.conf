# Disease Prediction System - Logging Configuration
# This file configures comprehensive logging for the application
# Supports multiple handlers, formatters, and log levels

[loggers]
keys=root,app,flask,ml,api,security,performance

[handlers]
keys=consoleHandler,fileHandler,errorHandler,mlHandler,apiHandler,securityHandler,rotatingHandler

[formatters]
keys=simpleFormatter,detailedFormatter,jsonFormatter,timestampFormatter,colorFormatter

# =============================================================================
# LOGGER CONFIGURATION
# =============================================================================

[logger_root]
level=INFO
handlers=consoleHandler,fileHandler,errorHandler

[logger_app]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=app
propagate=0

[logger_flask]
level=WARNING
handlers=consoleHandler,rotatingHandler
qualname=werkzeug
propagate=0

[logger_ml]
level=INFO
handlers=consoleHandler,mlHandler
qualname=ml
propagate=0

[logger_api]
level=INFO
handlers=consoleHandler,apiHandler
qualname=api
propagate=0

[logger_security]
level=WARNING
handlers=consoleHandler,securityHandler,errorHandler
qualname=security
propagate=0

[logger_performance]
level=INFO
handlers=consoleHandler,fileHandler
qualname=performance
propagate=0

# =============================================================================
# HANDLER CONFIGURATION
# =============================================================================

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=colorFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=handlers.RotatingFileHandler
level=DEBUG
formatter=detailedFormatter
args=('logs/app.log', 'a', 10485760, 5, 'utf-8')

[handler_errorHandler]
class=handlers.RotatingFileHandler
level=ERROR
formatter=jsonFormatter
args=('logs/error.log', 'a', 10485760, 5, 'utf-8')

[handler_mlHandler]
class=handlers.RotatingFileHandler
level=DEBUG
formatter=timestampFormatter
args=('logs/ml.log', 'a', 10485760, 3, 'utf-8')

[handler_apiHandler]
class=handlers.RotatingFileHandler
level=INFO
formatter=jsonFormatter
args=('logs/api.log', 'a', 10485760, 3, 'utf-8')

[handler_securityHandler]
class=handlers.RotatingFileHandler
level=WARNING
formatter=jsonFormatter
args=('logs/security.log', 'a', 10485760, 10, 'utf-8')

[handler_rotatingHandler]
class=handlers.TimedRotatingFileHandler
level=INFO
formatter=simpleFormatter
args=('logs/flask.log', 'midnight', 1, 7, 'utf-8')

# =============================================================================
# FORMATTER CONFIGURATION
# =============================================================================

[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_detailedFormatter]
format=[%(asctime)s] %(levelname)s [%(name)s.%(funcName)s:%(lineno)d] %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_jsonFormatter]
format={"timestamp": "%(asctime)s", "level": "%(levelname)s", "logger": "%(name)s", "function": "%(funcName)s", "line": %(lineno)d, "message": "%(message)s"}
datefmt=%Y-%m-%d %H:%M:%S

[formatter_timestampFormatter]
format=%(asctime)s.%(msecs)03d | %(levelname)-8s | %(name)-15s | %(funcName)-20s | %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_colorFormatter]
format=%(log_color)s[%(asctime)s] %(levelname)-8s%(reset)s %(blue)s%(name)s%(reset)s: %(message)s
datefmt=%H:%M:%S

# =============================================================================
# LOGGING BEST PRACTICES AND GUIDELINES
# =============================================================================

# Log Levels Usage:
# - DEBUG: Detailed information for diagnosing problems (development only)
# - INFO: General information about application flow
# - WARNING: Something unexpected happened, but application continues
# - ERROR: Serious problem occurred, function/feature failed
# - CRITICAL: Very serious error, application may not continue

# Security Logging Guidelines:
# - Log authentication attempts (success/failure)
# - Log authorization failures
# - Log input validation failures
# - Log configuration changes
# - Never log sensitive data (passwords, tokens, PII)

# Performance Logging Guidelines:
# - Log slow database queries (>100ms)
# - Log API response times
# - Log memory usage spikes
# - Log cache hit/miss ratios
# - Log model prediction times

# ML Logging Guidelines:
# - Log model training start/completion
# - Log model accuracy metrics
# - Log prediction confidence scores
# - Log data preprocessing steps
# - Log feature engineering operations

# API Logging Guidelines:
# - Log all API requests with timestamps
# - Log request/response sizes
# - Log client IP addresses
# - Log rate limiting events
# - Log API errors with context

# File Rotation Guidelines:
# - Rotate logs daily for high-traffic applications
# - Keep 7 days of rotated logs for debugging
# - Compress old log files to save space
# - Monitor disk usage for log directories
# - Set up log aggregation for production

